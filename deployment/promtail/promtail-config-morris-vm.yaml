# STORY-915: Promtail config for Morris VM
# Scrapes two projects: ops_console and morris
# Rollout order: ops_console first, morris second (per seed constraints)
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: https://grafana.gorillacommerce.ai/loki/api/v1/push

scrape_configs:
  # ── project=ops_console ─────────────────────────────────────────────
  # Ops console is a Docker container (ops-console) fronted by Uvicorn.
  # Scrape its systemd journal (Docker logs routed through journald).
  - job_name: ops-console-journal
    journal:
      labels:
        job: ops-console
        project: ops_console
        agent: morris-vm
        service: ops-console
        env: dev
      path: /var/log/journal
    relabel_configs:
      - source_labels: ['__journal_container_name']
        regex: 'ops-console'
        action: keep
    pipeline_stages:
      - regex:
          expression: '(?i)(?P<log_level>CRITICAL|ERROR|WARNING|INFO|DEBUG)'
      - labels:
          severity: log_level
      - match:
          selector: '{severity=""}'
          stages:
            - static_labels:
                severity: info

  # Ops console application log file (if service writes to file directly)
  - job_name: ops-console-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: ops-console
          project: ops_console
          agent: morris-vm
          service: ops-console
          env: dev
          __path__: /var/log/ops-console/*.log
    pipeline_stages:
      - regex:
          expression: '(?i)(?P<log_level>CRITICAL|ERROR|WARNING|INFO|DEBUG)'
      - labels:
          severity: log_level
      - match:
          selector: '{severity=""}'
          stages:
            - static_labels:
                severity: info

  # ── project=morris ──────────────────────────────────────────────────
  # Morris orchestrator writes to /var/log/morris/orchestrator.log
  - job_name: morris-orchestrator-file
    static_configs:
      - targets: [localhost]
        labels:
          job: morris-orchestrator
          project: morris
          agent: morris-vm
          service: morris-orchestrator
          env: dev
          __path__: /var/log/morris/orchestrator.log
    pipeline_stages:
      - regex:
          expression: '(?i)(?P<log_level>CRITICAL|ERROR|WARNING|INFO|DEBUG)'
      - labels:
          severity: log_level
      - match:
          selector: '{severity=""}'
          stages:
            - static_labels:
                severity: info

  # Morris orchestrator systemd journal
  - job_name: morris-orchestrator-journal
    journal:
      labels:
        job: morris-orchestrator-journal
        project: morris
        agent: morris-vm
        service: morris-orchestrator
        env: dev
      path: /var/log/journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        regex: 'morris-orchestrator\.service'
        action: keep
    pipeline_stages:
      - regex:
          expression: '(?i)(?P<log_level>CRITICAL|ERROR|WARNING|INFO|DEBUG)'
      - labels:
          severity: log_level
      - match:
          selector: '{severity=""}'
          stages:
            - static_labels:
                severity: info

  # Morris fleet-check cron logs
  - job_name: morris-fleet-check-journal
    journal:
      labels:
        job: morris-fleet-check
        project: morris
        agent: morris-vm
        service: morris-fleet-check
        env: dev
      path: /var/log/journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        regex: 'morris-fleet-check\.service'
        action: keep
    pipeline_stages:
      - regex:
          expression: '(?i)(?P<log_level>CRITICAL|ERROR|WARNING|INFO|DEBUG)'
      - labels:
          severity: log_level
      - match:
          selector: '{severity=""}'
          stages:
            - static_labels:
                severity: info
