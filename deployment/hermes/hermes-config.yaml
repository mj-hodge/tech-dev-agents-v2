model:
  provider: "anthropic"
  default: "claude-sonnet-4-6"
  api_key: "${ANTHROPIC_API_KEY}"

compression:
  enabled: true
  threshold: 0.50

terminal:
  backend: local
  cwd: "/home/agents/workspace"
  timeout: 300
  persistent_shell: true

toolsets:
  - terminal
  - memory
  - skills

agent:
  max_turns: 90
  reasoning_effort: "high"

approvals:
  mode: always_approve
