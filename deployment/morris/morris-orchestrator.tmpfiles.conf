# STORY-724 lock file for orchestrator_loop.py.
# Without this, the orchestrator crashes on every cron tick after reboot
# with PermissionError on /var/run/morris-orchestrator.lock — /run is a
# tmpfs and is wiped on every boot.
#
# Install on Morris VM:
#   sudo cp morris-orchestrator.tmpfiles.conf /etc/tmpfiles.d/
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/morris-orchestrator.tmpfiles.conf
#
# 2026-04-26 incident: orchestrator dry-run crashed with permission denied;
# stopgap was a manual `sudo touch + chown`, lost on next reboot.
f /var/run/morris-orchestrator.lock 0644 hermes hermes -
