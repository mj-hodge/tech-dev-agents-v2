ops_console:
  url: "${OPS_CONSOLE_URL}"
  api_key: "${OPS_CONSOLE_API_KEY}"

agents:
  github_logins:
    skynet: "Bot Skynet"
    architect: "Bot Architect"
    neo: "Bot Neo"
    morpheus: "Bot Morpheus"
    smith: "Bot Smith"
  pr_repos:
    - "cybertronics/tech-dev-agents"

thresholds:
  never_started_minutes: 15
  heartbeat_stale_minutes: 15
  phase_stale_minutes: 45
  needs_info_decay_hours: 4
  repeated_failure_count: 3
  overload_pending_count: 3
  max_stale_releases: 3

interventions:
  rebase:
    enabled: false
    timeout_seconds: 300
    script_path: "/home/agents/skynet/scripts/auto_rebase_pr.sh"
  release:
    enabled: true

operating_modes:
  light_quota_threshold: 0.70
  minimal_quota_threshold: 0.90
  recovery_to_light_threshold: 0.60
  recovery_to_full_threshold: 0.50
  mark_cooldown_minutes: 120
  overnight_start_utc: "05:00"
  overnight_end_utc: "12:00"

workdir: "/home/agents/skynet/workspace"
log_path: "/var/log/skynet/orchestrator.log"
lock_path: "/var/run/skynet-orchestrator.lock"
