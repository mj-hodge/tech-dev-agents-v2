# /etc/apparmor.d/bwrap
# Grants /usr/bin/bwrap permission to create unprivileged user namespaces.
#
# WHY THIS EXISTS:
# Ubuntu 24.04+ ships with kernel.apparmor_restrict_unprivileged_userns=1, which
# requires binaries that create unprivileged user namespaces (clone(CLONE_NEWUSER)
# without root) to have an AppArmor profile that explicitly grants `userns,`.
# Without this profile, every codex CLI invocation that uses bubblewrap to
# sandbox subprocesses fails with:
#   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
# Verified blocker on agent VMs 2026-04-25.
#
# This profile is intentionally unconfined — bubblewrap is itself a sandboxing
# tool, so AppArmor confinement on top of it provides no extra protection. The
# unprivileged_userns profile (which Ubuntu auto-applies inside the namespace
# bwrap creates) handles the actual confinement of whatever runs under bwrap.
#
# INSTALL:
#   sudo cp deployment/vm/apparmor-bwrap.conf /etc/apparmor.d/bwrap
#   sudo apparmor_parser -r /etc/apparmor.d/bwrap
#   sudo aa-status | grep bwrap   # confirm "bwrap" is in the loaded profiles
#
# REVERT:
#   sudo apparmor_parser -R /etc/apparmor.d/bwrap
#   sudo rm /etc/apparmor.d/bwrap
#
# DOES NOT relax kernel.apparmor_restrict_unprivileged_userns globally — only
# /usr/bin/bwrap gets the userns exception. All other binaries remain restricted.

abi <abi/4.0>,
include <tunables/global>

profile bwrap /usr/bin/bwrap flags=(unconfined) {
  userns,
}
