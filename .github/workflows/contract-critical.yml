name: Contract Critical Tests

# STORY-544: Dedicated CI job that gates merges on contract-critical test health.
# Separate from test.yml so contract failures are immediately visible in PR checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: contract-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-critical:
    name: Contract-critical invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout respx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Run contract-critical tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/contracts/ \
            -m contract_critical \
            --tb=short -q --timeout=30
