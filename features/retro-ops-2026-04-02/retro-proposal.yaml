  - id: F-008
    finding: "Agent registry format mismatch between ops_console code and deployment files caused crashes"
    category: "Phase 6"
    severity: Medium
    target_file: "agents/phase-6-design.md"
    action: "For multi-component deployments, Phase 6 should include interface schema definitions for shared config files"
    proposed_text: |
      ## Shared Config Schema (REQUIRED for multi-component projects)
      When multiple components consume the same config file (e.g., agent-registry.json):
      - Define a JSON schema in the design doc
      - Both producer and consumer must validate against it
      - Schema changes require updating all consumers
    evidence:
      occurrences: 2
      stories: ["STORY-018", "Ops console deploy"]

  - id: F-009
    finding: "Agents using claude CLI directly instead of SDK wrapper — cost tracking lost"
    category: "Phase 8"
    severity: Medium
    target_file: "agents/phase-8-implementation.md"
    action: "Mandate SDK wrapper for all Claude Code invocations in agent-managed projects"
    proposed_text: |
      ## Agent SDK Enforcement (for agent-managed projects)
      When agents execute Claude Code, they MUST use the SDK wrapper (claude_sdk_tool.py)
      rather than the bare `claude` CLI. The wrapper provides:
      - Cost tracking ([DONE] cost=$X logged to Grafana)
      - Approval logging ([APPROVED]/[DENIED] markers)
      - Session management (resume capability)
      Without the wrapper, costs are invisible and approval audit trail is lost.
    evidence:
      occurrences: 2
      stories: ["Derrick STORY-090", "Dan STORY-088"]

  - id: F-010
    finding: "Pre-deploy gate doesn't verify agent configuration (SOUL.md, config.yaml, skills, terminal guard)"
    category: "Phase 11"
    severity: Medium
    target_file: "agents/phase-11-predeploy.md"
    action: "Add agent configuration verification to pre-deploy gate for agent infrastructure stories"
    proposed_text: |
      ## Check: Agent Configuration (for agent infrastructure stories)
      - [ ] SOUL.md contains required sections (Cost Discipline, Story Assignment, SDK Mandate, Token Exhaustion, Handback)
      - [ ] hermes-config.yaml has no duplicate keys
      - [ ] Terminal guard imports successfully (python3 -c 'from terminal_guard import check_command')
      - [ ] All Hermes skills referenced in SOUL.md exist on the VM
      - [ ] Claude Code auth is valid (claude auth status returns loggedIn: true)
    evidence:
      occurrences: 2
      stories: ["STORY-018", "Terminal guard bug"]
